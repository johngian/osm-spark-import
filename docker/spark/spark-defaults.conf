# Local development cluster (docker-compose.yml).
spark.master                                   spark://spark-master:7077
spark.hadoop.fs.defaultFS                      hdfs://namenode:8020
spark.hadoop.dfs.client.use.datanode.hostname  false
# jobs run in the client container: executors connect back to it by name
spark.driver.host                              client
spark.driver.bindAddress                       0.0.0.0
spark.sql.execution.arrow.maxRecordsPerBatch   2000

spark.sql.extensions                           org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.osm                          org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.osm.type                     hadoop
spark.sql.catalog.osm.warehouse                hdfs://namenode:8020/osm/warehouse

spark.driver.memory                            2g
spark.executor.memory                          2g
spark.sql.shuffle.partitions                   64
spark.sql.adaptive.coalescePartitions.enabled  true
spark.sql.adaptive.enabled                     true
spark.ui.showConsoleProgress                   false
