[project]
name = "osm-spark-import"
version = "0.3.0.dev"
description = "OSM import pipeline with Spark: pyosmium, Iceberg/Parquet, PostgreSQL"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# pyspark comes from requirements.txt (conda env, docker image), in the version
# that matches the Iceberg runtime JAR
dependencies = [
  "osmium==4.3.2",
  "shapely==2.1.2",
  "pyproj==3.7.1",
  "mercantile==1.2.1",
  "numpy",
  "pyarrow>=15",
  "pandas",
  "pyyaml",
  "fsspec[http]>=2024.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest"]
kerberos = ["requests-kerberos"]  # OSM_WEBHDFS_KERBEROS
dev = ["black==24.10.0", "isort==5.13.2", "ruff==0.8.4"]

[project.scripts]
osm-spark-import = "osm_spark_import.cli:main"
osm-spark-import-loader = "osm_spark_import.loader:main"
osm-spark-import-compare = "osm_spark_import.compare:main"

[tool.setuptools]
# the PySpark application of SparkSubmitOperator.for_virtualenv: bin/osm_spark_import_job.py
script-files = ["bin/osm_spark_import_job.py"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["osm_spark_import"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade, absolute imports; import order is isort's, line length black's
select = ["E", "W", "F", "B", "UP", "TID252"]
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
markers = ["spark: needs Java and the Iceberg runtime JAR (OSM_TEST_ICEBERG_JAR)"]
