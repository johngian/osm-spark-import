[project]
name = "osm-hadoop"
version = "0.2.0"
description = "OSM import pipeline on Hadoop/HDFS: pyosmium, Parquet, PostgreSQL"
requires-python = ">=3.10"
# pyspark is installed by the image, in the version the cluster runs
dependencies = [
  "osmium==4.3.2",
  "shapely==2.1.2",
  "numpy",
  "pyarrow>=15",
  "pandas",
  "pyyaml",
  "requests",
  "fsspec>=2024.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["black==24.10.0", "isort==5.13.2", "ruff==0.8.4"]

[project.scripts]
osm-hadoop = "osm_hadoop.cli:main"
osm-hadoop-loader = "osm_hadoop.loader:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["osm_hadoop", "osm_hadoop.mapping"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["osm_hadoop"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade; imports are isort's, line length black's
select = ["E", "W", "F", "B", "UP"]
ignore = ["E501"]
