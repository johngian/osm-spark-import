[project]
name = "osm-spark-import"
version = "0.2.0"
description = "OSM import pipeline with Spark: pyosmium, Iceberg/Parquet, PostgreSQL"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
# pyspark is installed by the image, in the version the cluster runs
dependencies = [
  "osmium==4.3.2",
  "shapely==2.1.2",
  "numpy",
  "pyarrow>=15",
  "pandas",
  "pyyaml",
  "requests",
  "fsspec>=2024.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
test = ["pytest"]
dev = ["black==24.10.0", "isort==5.13.2", "ruff==0.8.4"]

[project.scripts]
osm-spark-import = "osm_spark_import.cli:main"
osm-spark-import-loader = "osm_spark_import.loader:main"
osm-spark-import-compare = "osm_spark_import.compare:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["osm_spark_import", "osm_spark_import.mapping"]

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = ["osm_spark_import"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, bugbear, pyupgrade; imports are isort's, line length black's
select = ["E", "W", "F", "B", "UP"]
ignore = ["E501"]
